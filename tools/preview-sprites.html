<!doctype html><meta charset="utf-8"><body style="background:#f1e8d6;margin:8px;font:12px serif">
<div id="g" style="display:grid;grid-template-columns:repeat(8,96px);gap:6px"></div>
<script type="module">
import { drawSprite } from '../js/sprite.js';
const W = ['kiem', 'dao', 'thuong', 'quat', null];
const cases = [];
for (let i = 0; i < 8; i++) cases.push({ seed: 100 + i, g: i % 2 ? 'nu' : 'nam', age: 22, life: 100, realm: i % 4, robe: null, wep: W[i % 5] });
for (let i = 0; i < 8; i++) cases.push({ seed: 300 + i, g: i % 2 ? 'nu' : 'nam', age: 60, life: 300, realm: i, robe: ['#4f8fd6', '#d65a4f', '#5fae5a', '#c58fd6'][i % 4], wep: W[(i + 2) % 5] });
const B = ['Hắc Lang', 'Xích Luyện Xà', 'Song Đầu Ưng', 'Ngân Lân Giao', 'Hỏa Vân Báo', 'Huyết Nha Bức Vương', 'Thái Cổ Ma Long', 'Thạch Linh Cự Nhân'];
B.forEach((n, i) => cases.push({ type: 'beast', seed: 900 + i, realm: i, name: n }));
for (const c of cases) {
  const cv = document.createElement('canvas'); cv.width = 32; cv.height = 40;
  cv.style.cssText = 'width:96px;height:120px;image-rendering:pixelated;background:#fbf6ea;border:1px solid #d9cbb0;border-radius:8px';
  drawSprite(cv, c); document.getElementById('g').appendChild(cv);
}
</script>
